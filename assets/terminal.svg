<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <style>
      .terminal-bg { fill: #1a1b26; }
      .terminal-border { fill: #24283b; }
      .title-bar { fill: #1f2335; }
      .btn-red { fill: #f7768e; }
      .btn-yellow { fill: #e0af68; }
      .btn-green { fill: #9ece6a; }
      .text { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
      .prompt { fill: #7aa2f7; }
      .command { fill: #c0caf5; }
      .cyan { fill: #7dcfff; }
      .green { fill: #9ece6a; }
      .dim { fill: #565f89; }
      .white { fill: #c0caf5; }
    </style>
    <linearGradient id="808-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2F2E3E" />
      <stop offset="25%" style="stop-color:#E6E8BF" />
      <stop offset="50%" style="stop-color:#DDDA00" />
      <stop offset="75%" style="stop-color:#F27900" />
      <stop offset="100%" style="stop-color:#DD1D00" />
    </linearGradient>
  </defs>

  <!-- Window -->
  <rect class="terminal-border" width="960" height="540" rx="12"/>
  <rect class="terminal-bg" x="1" y="1" width="958" height="538" rx="11"/>

  <!-- Title bar -->
  <rect class="title-bar" x="1" y="1" width="958" height="36" rx="11"/>
  <rect class="terminal-bg" x="1" y="26" width="958" height="12"/>

  <!-- Window buttons -->
  <circle class="btn-red" cx="24" cy="19" r="7"/>
  <circle class="btn-yellow" cx="48" cy="19" r="7"/>
  <circle class="btn-green" cx="72" cy="19" r="7"/>

  <!-- Title -->
  <text x="480" y="24" text-anchor="middle" class="text dim" font-size="13">Terminal</text>

  <!-- Content -->
  <g transform="translate(32, 72)">
    <!-- Prompt line -->
    <text class="text prompt" font-size="15" y="0">~</text>
    <text class="text dim" font-size="15" x="16" y="0">$</text>
    <text class="text command" font-size="15" x="36" y="0">npx 808</text>

    <!-- Banner -->
    <text font-size="14" y="48" xml:space="preserve" fill="url(#808-gradient)" >  █████╗       █████╗       █████╗ </text>
    <text font-size="14" y="68" xml:space="preserve" fill="url(#808-gradient)" >██╔══██╗ ██╔══██╗ ██╔══██╗</text>
    <text font-size="14" y="88" xml:space="preserve" fill="url(#808-gradient)" >╚█████╔╝ ██║      ██║ ╚█████╔╝</text>
    <text font-size="14" y="108" xml:space="preserve" fill="url(#808-gradient)">██╔══██╗ ██║      ██║ ██╔══██╗</text>
    <text font-size="14" y="128" xml:space="preserve" fill="url(#808-gradient)">╚█████╔╝ ╚█████╔╝ ╚█████╔╝</text>
    <text font-size="14" y="148" xml:space="preserve" fill="url(#808-gradient)">  ╚════╝       ╚════╝       ╚════╝ </text>

    <!-- Title and subtitle -->
    <text class="text white" font-size="15" y="188">  808 <tspan class="dim">v1.0.1</tspan></text>
    <text class="text white" font-size="15" y="212">  A meta-prompting, context engineering and spec-driven</text>
    <text class="text white" font-size="15" y="232">  development system for Claude Code by TÂCHES.</text>

    <!-- Install output -->
    <text class="text" font-size="15" y="280"><tspan class="green">  ✓</tspan><tspan class="white"> Installed commands/808</tspan></text>
    <text class="text" font-size="15" y="304"><tspan class="green">  ✓</tspan><tspan class="white"> Installed 808</tspan></text>

    <!-- Done message -->
    <text class="text" font-size="15" y="352"><tspan class="green">  Done!</tspan><tspan class="white"> Run </tspan><tspan class="cyan">/808:help</tspan><tspan class="white"> to get started.</tspan></text>

    <!-- New prompt -->
    <text class="text prompt" font-size="15" y="400">~</text>
    <text class="text dim" font-size="15" x="16" y="400">$</text>
    <text class="text white" font-size="15" x="36" y="400">▌</text>
  </g>
</svg>
